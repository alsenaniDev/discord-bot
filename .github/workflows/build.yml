name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        run: dotnet restore DiscordBot.sln
      - name: Build
        run: dotnet build DiscordBot.sln --no-restore --configuration Release
      - name: Verify EF migrations compile
        run: |
          dotnet ef migrations list \
            --project src/DiscordBot.Infrastructure \
            --startup-project src/DiscordBot.Api \
            --no-build

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dashboard/DiscordBot.Dashboard/package-lock.json
      - name: Install
        working-directory: dashboard/DiscordBot.Dashboard
        run: npm ci
      - name: Build
        working-directory: dashboard/DiscordBot.Dashboard
        run: npm run build
