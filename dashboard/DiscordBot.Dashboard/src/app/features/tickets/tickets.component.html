<div class="page-content page-workspace tickets-page ws-page">
  <app-loading-state *ngIf="loading" [message]="'tickets.loading' | translate"></app-loading-state>

  <app-error-state
    *ngIf="!loading && error"
    [title]="'tickets.loadError' | translate"
    [description]="error"
    [retryLabel]="'common.tryAgain' | translate"
    (retry)="loadTickets()"
  ></app-error-state>

  <div class="tickets-layout ws-layout" *ngIf="!loading && !error">
    <header class="tickets-atf">
      <app-page-workspace-hero
        class="tickets-workspace-hero"
        [ariaLabel]="'workspaceHero.tickets.ariaLabel' | translate"
        icon="tickets"
        [title]="'titles.tickets' | translate"
        [description]="'titles.ticketsSubtitle' | translate"
        [stats]="workspaceHeroStats"
        [footerMessage]="workspaceHeroFooter"
        [primaryAction]="workspaceHeroPrimaryAction"
        (primaryActionClick)="onHeroPrimaryAction()"
      ></app-page-workspace-hero>
    </header>

    <main class="tickets-workspace ws-workspace">
      <app-tickets-filter-bar
        class="tickets-workspace-filters"
        [statusFilter]="statusFilter"
        [totalCount]="totalCount"
        [page]="page"
        [totalPages]="totalPages"
        (statusChange)="onStatusFilterChange($event)"
        (prevPage)="goToPage(page - 1)"
        (nextPage)="goToPage(page + 1)"
      ></app-tickets-filter-bar>

      <div class="tickets-master-detail ws-master-detail ws-master-detail--split">
        <section class="tickets-queue-column" [attr.aria-label]="'tickets.workspace.queueAria' | translate">
          <app-empty-state
            *ngIf="tickets.length === 0 && statusFilter === 'all'"
            icon="🎫"
            [title]="'tickets.emptyTitle' | translate"
            [description]="'tickets.emptyBody' | translate"
          ></app-empty-state>

          <app-empty-state
            *ngIf="tickets.length === 0 && statusFilter !== 'all'"
            icon="🔍"
            [title]="'tickets.workspace.emptyFilteredTitle' | translate"
            [description]="'tickets.workspace.emptyFilteredBody' | translate"
          >
            <button type="button" class="btn btn-secondary btn-sm" (click)="onStatusFilterChange('all')">
              {{ 'tickets.workspace.clearFilter' | translate }}
            </button>
          </app-empty-state>

          <div class="tickets-queue-scroll" *ngIf="tickets.length > 0">
            <div class="tickets-queue" role="list">
              <div *ngFor="let ticket of tickets" role="listitem" [attr.id]="'ticket-' + ticket.ticketId">
                <app-tickets-queue-card
                  [ticket]="ticket"
                  [selected]="isSelected(ticket)"
                  [open]="isOpen(ticket)"
                  [statusLabelKey]="statusLabel(ticket.status)"
                  [ownerLabel]="displayMember(ticket.ownerUsername, ticket.ownerDiscordId)"
                  [preview]="ticket.lastMessagePreview || ''"
                  (select)="selectTicket(ticket)"
                ></app-tickets-queue-card>
              </div>
            </div>
          </div>
        </section>

        <aside
          class="tickets-detail-column"
          [attr.aria-label]="'tickets.workspace.drawerAria' | translate"
        >
          <div class="tickets-detail-placeholder ws-placeholder-panel" *ngIf="!selectedTicket">
            <div class="tickets-detail-placeholder-icon ws-placeholder-panel-icon" aria-hidden="true">
              <app-ui-icon name="tickets" size="lg"></app-ui-icon>
            </div>
            <h2 class="tickets-detail-placeholder-title ws-placeholder-panel-title">{{ 'tickets.workspace.selectPromptTitle' | translate }}</h2>
            <p class="tickets-detail-placeholder-body ws-placeholder-panel-body muted">{{ 'tickets.workspace.selectPromptBody' | translate }}</p>
          </div>

          <app-tickets-context-drawer
            *ngIf="selectedTicket"
            #ticketDetailPanel
            [ticket]="selectedTicket"
            [guildId]="guildId"
            [open]="true"
            [inline]="true"
            [statusLabelKey]="statusLabel(selectedTicket.status)"
            [ownerLabel]="displayMember(selectedTicket.ownerUsername, selectedTicket.ownerDiscordId)"
            [channelLabel]="displayChannel(selectedTicket.discordChannelId)"
            [canReply]="canReply"
            [canClose]="canClose"
            [isClosing]="isClosing(selectedTicket)"
            [isReplying]="isReplying(selectedTicket)"
            [isSendingReply]="isSendingReply(selectedTicket)"
            [replyDraft]="replyDrafts[selectedTicket.ticketId] || ''"
            [conversation]="conversationFor(selectedTicket)"
            [conversationLoading]="isConversationLoading(selectedTicket)"
            [conversationLoadingMore]="isConversationLoadingMore(selectedTicket)"
            [conversationError]="conversationError(selectedTicket)"
            [hasMoreConversation]="hasMoreConversation(selectedTicket)"
            (closeDrawer)="closeDrawer()"
            (refreshConversation)="loadConversation(selectedTicket, true)"
            (loadMoreConversation)="loadConversation(selectedTicket, false, true)"
            (toggleReply)="toggleReply(selectedTicket)"
            (replyDraftChange)="onReplyDraftChange(selectedTicket.ticketId, $event)"
            (sendReply)="sendReply(selectedTicket)"
            (closeTicket)="closeTicket(selectedTicket)"
          ></app-tickets-context-drawer>
        </aside>
      </div>
    </main>
  </div>
</div>
