<div class="page-content">
  <app-loading-state *ngIf="loading" [message]="'modules.loading' | translate"></app-loading-state>

  <app-empty-state
    *ngIf="!loading && error"
    icon="⚠️"
    [title]="'modules.loadError' | translate"
    [description]="error"
  >
    <button type="button" class="btn btn-secondary btn-sm" (click)="loadModules()">{{ 'common.retry' | translate }}</button>
  </app-empty-state>

  <div *ngIf="!loading && !error" class="modules-stack">
    <p class="muted intro">{{ 'modules.subtitle' | translate }}</p>

    <article
      class="card module-card"
      *ngFor="let module of modules"
      [class.module-locked]="!module.allowedByPlan"
    >
      <div class="module-card-body">
        <div>
          <h2>{{ module.name }}</h2>
          <p class="muted">{{ module.description }}</p>

          <span
            class="status-pill"
            *ngIf="module.allowedByPlan"
            [class.enabled]="effectiveEnabled(module)"
            [class.disabled]="!effectiveEnabled(module)"
          >
            {{ (effectiveEnabled(module) ? 'modules.enabledLabel' : 'modules.disabledLabel') | translate }}
          </span>

          <span class="status-pill locked" *ngIf="!module.allowedByPlan">
            {{ 'modules.lockedByPlan' | translate }}
          </span>

          <p class="plan-upgrade muted small" *ngIf="!module.allowedByPlan">
            {{ 'modules.upgradePlan' | translate }}
          </p>
        </div>

        <label
          class="toggle"
          [class.saving]="isSaving(module)"
          [class.locked]="!module.allowedByPlan"
        >
          <input
            type="checkbox"
            [checked]="effectiveEnabled(module)"
            [disabled]="!canToggle(module)"
            (change)="onToggle(module, $any($event.target).checked)"
          />
          <span class="toggle-track" aria-hidden="true"></span>
          <span class="sr-only">{{ module.name }}</span>
        </label>
      </div>
    </article>
  </div>
</div>
