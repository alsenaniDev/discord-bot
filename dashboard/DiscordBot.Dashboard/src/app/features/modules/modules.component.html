<div class="page-content page-workspace modules-page ws-page ws-page--compact">
  <app-loading-state *ngIf="loading" [message]="'modules.loading' | translate"></app-loading-state>

  <app-error-state
    *ngIf="!loading && error"
    [title]="'modules.loadError' | translate"
    [description]="error"
    [retryLabel]="'common.retry' | translate"
    (retry)="loadModules()"
  ></app-error-state>

  <div class="modules-layout ws-layout" *ngIf="!loading && !error">
    <header class="modules-atf ws-atf">
      <app-page-workspace-hero
        [ariaLabel]="'modules.hero.ariaLabel' | translate"
        icon="modules"
        [title]="'modules.title' | translate"
        [description]="'modules.hero.description' | translate"
        [stats]="workspaceHeroStats"
        [footerMessage]="workspaceHeroFooter"
        [primaryAction]="workspaceHeroPrimaryAction"
        (primaryActionClick)="onHeroCta(heroCta)"
      ></app-page-workspace-hero>
    </header>

    <main class="modules-workspace ws-workspace ws-workspace--sections" id="modules-workspace">
      <section
        *ngFor="let group of groupedModules"
        class="modules-category"
        role="region"
        [attr.aria-labelledby]="'modules-category-' + group.category"
      >
        <app-section-header
          [title]="categoryTitleKey(group.category) | translate"
          [lead]="categoryLeadKey(group.category) | translate"
          [titleId]="'modules-category-' + group.category"
          [emphasis]="true"
          [wideLead]="true"
          [compact]="true"
        ></app-section-header>

        <div class="modules-category-grid ws-grid ws-grid--2">
          <app-modules-module-card
            *ngFor="let module of group.modules"
            [module]="module"
            [icon]="$any(moduleIcon(module.key))"
            [iconTone]="$any(moduleIconTone(module.key))"
            [displayName]="moduleDisplayName(module)"
            [displayDescription]="moduleDisplayDescription(module)"
            [status]="moduleStatus(module)"
            [primaryAction]="modulePrimaryAction(module)"
            [saving]="isSaving(module)"
            [canToggle]="canToggle(module)"
            [toggleChecked]="effectiveEnabled(module)"
            (primaryActionClick)="onModulePrimaryAction(module)"
            (toggleChange)="onToggle(module, $event)"
          ></app-modules-module-card>
        </div>
      </section>
    </main>
  </div>
</div>
