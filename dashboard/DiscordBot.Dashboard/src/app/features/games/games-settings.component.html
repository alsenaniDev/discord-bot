<div class="page-content page-workspace" dir="rtl">
  <app-loading-state *ngIf="loading" message="جاري تحميل مركز الألعاب..."></app-loading-state>
  <app-error-state *ngIf="!loading && error" title="تعذر تحميل الألعاب" [description]="error" retryLabel="إعادة المحاولة" (retry)="load()"></app-error-state>
  <div class="settings-stack settings-stack--welcome games-stack" *ngIf="!loading && !error">
    <header class="settings-atf settings-atf--welcome"><app-page-workspace-hero class="settings-workspace-hero" icon="modules" ariaLabel="مركز الألعاب" title="🎮 مركز الألعاب" description="فعّل الألعاب وحدد الروم والنقاط وطريقة نشر النتائج." [stats]="stats" footerMessage="الألعاب تعمل فقط داخل الروم المحدد، والنتائج تُنشر بعد تحقق المنصة منها." [primaryAction]="action" (primaryActionClick)="saveSettings()"></app-page-workspace-hero></header>
    <app-page-notice>استخدم الأمر <bdi>/games</bdi> داخل روم الألعاب بعد تفعيل لعبة واحدة على الأقل.</app-page-notice>
    <form class="card settings-card" [formGroup]="form" (ngSubmit)="saveSettings()">
      <app-section-header title="الإعدادات العامة" lead="تحكم بوصول الأعضاء إلى مركز الألعاب في هذا السيرفر." [compact]="true"></app-section-header>
      <div class="settings-grid"><label class="checkbox wide"><input type="checkbox" formControlName="isEnabled">تفعيل الألعاب</label><label class="form-field"><span>روم الألعاب</span><select class="input ds-select" formControlName="gamesChannelDiscordId"><option value="">اختر رومًا نصيًا</option><option *ngFor="let channel of channels" [value]="channel.discordChannelId"># {{channel.name}}</option></select><span class="hint">لن تبدأ الألعاب ولن تُنشر النتائج خارج هذا الروم.</span></label><label class="checkbox"><input type="checkbox" formControlName="autoPostPanel">نشر لوحة الألعاب تلقائيًا (قريبًا)</label></div>
      <div class="form-actions"><button class="btn btn-primary" [disabled]="saving">{{saving ? 'جاري الحفظ...' : 'حفظ الإعدادات'}}</button></div>
    </form>

    <section class="games-list"><app-section-header title="الألعاب المتاحة" lead="يمكنك تفعيل الألعاب التي نشرها مدير المنصة فقط." [compact]="true"></app-section-header>
      <article class="card game-card" *ngFor="let game of games" [class.locked]="!game.isAvailableByPlan">
        <div class="game-header"><div><h3>{{game.name}}</h3><p class="muted">{{game.description}}</p></div><span class="badge" [class.badge-success]="game.isAvailableByPlan">{{game.isAvailableByPlan ? 'متاحة في الباقة' : 'مقفلة حسب الباقة'}}</span></div>
        <div class="game-controls"><label class="checkbox wide"><input type="checkbox" [(ngModel)]="game.isEnabledForGuild" [ngModelOptions]="{standalone:true}" [disabled]="!game.isAvailableByPlan || !form.value.isEnabled">تفعيل اللعبة في السيرفر</label>
          <ng-container *ngIf="game.supportsScores"><label class="checkbox"><input type="checkbox" [(ngModel)]="game.pointsEnabled" [ngModelOptions]="{standalone:true}" [disabled]="!game.isAvailableByPlan">تفعيل النقاط</label><label class="form-field"><span>النقاط لكل فوز</span><input class="input ds-input" type="number" min="0" [(ngModel)]="game.pointsPerWin" [ngModelOptions]="{standalone:true}" [disabled]="!game.pointsEnabled || !game.isAvailableByPlan"></label></ng-container>
          <label class="form-field"><span>مدة الانتظار بين المحاولات</span><input class="input ds-input" type="number" min="0" [(ngModel)]="game.cooldownSeconds" [ngModelOptions]="{standalone:true}" [disabled]="!game.isAvailableByPlan"><span class="hint">بالثواني</span></label><label class="form-field"><span>الحد اليومي للعب</span><input class="input ds-input" type="number" min="0" [(ngModel)]="game.maxPlaysPerDay" [ngModelOptions]="{standalone:true}" [disabled]="!game.isAvailableByPlan"></label>
        </div>
        <div class="publishing" *ngIf="game.supportsResultPublishing || game.supportsLeaderboard"><h4>نشر النتائج</h4><div class="publishing-options"><label class="checkbox" *ngIf="game.supportsResultPublishing"><input type="checkbox" [(ngModel)]="game.publishResultAfterGame" [ngModelOptions]="{standalone:true}" [disabled]="!game.isAvailableByPlan">نشر النتيجة بعد انتهاء اللعبة</label><label class="checkbox" *ngIf="game.supportsLeaderboard"><input type="checkbox" [(ngModel)]="game.publishLeaderboardAfterGame" [ngModelOptions]="{standalone:true}" [disabled]="!game.isAvailableByPlan">نشر الترتيب بعد انتهاء اللعبة</label><label class="checkbox" *ngIf="game.supportsResultPublishing"><input type="checkbox" [(ngModel)]="game.publishOnlyWins" [ngModelOptions]="{standalone:true}" [disabled]="!game.publishResultAfterGame || !game.isAvailableByPlan">نشر نتائج الفوز فقط</label></div></div>
        <p class="locked-reason" *ngIf="game.lockedReason">{{game.lockedReason}}</p><div class="game-actions"><button class="btn btn-primary btn-sm" (click)="saveGame(game)" [disabled]="!game.isAvailableByPlan || savingGameId === game.id">{{savingGameId === game.id ? 'جاري الحفظ...' : 'حفظ إعدادات اللعبة'}}</button></div>
      </article><app-empty-state *ngIf="games.length === 0" title="لا توجد ألعاب متاحة" description="سيظهر هنا ما ينشره مدير المنصة من ألعاب."></app-empty-state>
    </section>

    <section class="card leaderboard"><app-section-header title="🏆 الترتيب" lead="أعلى اللاعبين حسب مجموع النقاط في السيرفر." [compact]="true"></app-section-header><div class="leader-row" *ngFor="let player of leaderboard; index as i"><strong>{{i + 1}}</strong><span>{{player.username}}</span><b>{{player.totalPoints}} نقطة</b><small>{{player.wins}} فوز</small></div><app-empty-state *ngIf="leaderboard.length === 0" title="لا توجد نتائج بعد" description="يظهر الترتيب بعد إكمال أول لعبة."></app-empty-state></section>
  </div>
</div>
