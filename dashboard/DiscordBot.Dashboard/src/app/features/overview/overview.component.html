<div class="page-content page-workspace">
  <app-loading-state *ngIf="loading" [message]="'common.loading' | translate" [skeleton]="true"></app-loading-state>

  <app-error-state
    *ngIf="!loading && error"
    [title]="'overview.loadError' | translate"
    [description]="error"
    [retryLabel]="'common.tryAgain' | translate"
    (retry)="loadOverview()"
  ></app-error-state>

  <div class="overview-shell" *ngIf="!loading && !error && overview && experience">
    <div class="overview-primary" [class.is-drawer-open]="contextDrawerOpen">
      <app-page-workspace-hero
        class="overview-workspace-hero slide-up"
        [ariaLabel]="'workspaceHero.overview.ariaLabel' | translate"
        [icon]="workspaceHeroIcon"
        [title]="workspaceHeroTitle"
        [description]="workspaceHeroDescription"
        [stats]="workspaceHeroStats"
        [footerMessage]="workspaceHeroFooter"
        [primaryAction]="workspaceHeroPrimaryAction"
        [dismissible]="!!missionCard?.dismissible && !missionCard?.error"
        [loading]="!!missionCard?.loading"
        (primaryActionClick)="missionCard?.error ? onMissionRetry() : onMissionCta()"
        (dismissClick)="onMissionDismiss()"
      ></app-page-workspace-hero>

      <app-activity-timeline class="overview-activity-timeline slide-up" [model]="activityTimeline"
        (rowClick)="onActivityRowClick($event)" (viewAllClick)="onActivityViewAll()"
        (retryClick)="onActivityRetry()"></app-activity-timeline>

      <app-context-drawer
        class="overview-context-drawer slide-up"
        [model]="contextDrawer"
        (navigate)="onDrawerNavigate($event)"
        (openChange)="contextDrawerOpen = $event"
      ></app-context-drawer>
    </div>
  </div>
</div>
