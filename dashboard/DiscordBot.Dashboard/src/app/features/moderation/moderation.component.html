<div class="page-content page-workspace moderation-page ws-page ws-workspace-page">
  <app-loading-state *ngIf="loading" [message]="'moderation.loading' | translate"></app-loading-state>

  <app-error-state
    *ngIf="!loading && error"
    [title]="'moderation.loadError' | translate"
    [description]="error"
    [retryLabel]="'common.tryAgain' | translate"
    (retry)="loadData()"
  ></app-error-state>

  <app-empty-state
    *ngIf="!loading && !error && !canAccessModeration"
    icon="🔒"
    [title]="'moderation.workspace.permissionTitle' | translate"
    [description]="'moderation.workspace.permissionBody' | translate"
  ></app-empty-state>

  <div class="moderation-layout ws-layout" *ngIf="!loading && !error && canAccessModeration">
    <header class="moderation-atf ws-atf">
      <app-page-workspace-hero
        class="moderation-workspace-hero"
        [ariaLabel]="'workspaceHero.moderation.ariaLabel' | translate"
        icon="shield"
        [title]="'titles.moderation' | translate"
        [description]="'titles.moderationSubtitle' | translate"
        [stats]="workspaceHeroStats"
        [footerMessage]="workspaceHeroFooter"
        [primaryAction]="workspaceHeroPrimaryAction"
        (primaryActionClick)="openModerationSettings()"
      ></app-page-workspace-hero>

      <app-page-notice>{{ 'moderation.workspace.notice' | translate }}</app-page-notice>
    </header>

    <main class="moderation-workspace ws-workspace">
      <app-moderation-filter-bar
        class="moderation-workspace-filters"
        [guildId]="guildId"
        [filters]="filters"
        [moderatorUserId]="uiModeratorUserId"
        [search]="uiSearch"
        [resultCount]="feedItems.length"
        (apply)="applyFilters()"
        (clear)="clearFilters()"
      ></app-moderation-filter-bar>

      <div class="moderation-master-detail ws-master-detail ws-master-detail--split">
        <section class="ws-feed-column" [attr.aria-label]="'moderation.workspace.feedAria' | translate">
          <app-section-header
            [title]="'moderation.workspace.feedTitle' | translate"
            [lead]="'moderation.workspace.feedLead' | translate"
            [compact]="true"
          ></app-section-header>

          <app-empty-state
            *ngIf="feedItems.length === 0 && !hasActiveFilters"
            icon="🛡️"
            [title]="'moderation.workspace.emptyTitle' | translate"
            [description]="'moderation.workspace.emptyBody' | translate"
          ></app-empty-state>

          <app-empty-state
            *ngIf="feedItems.length === 0 && hasActiveFilters"
            icon="🔍"
            [title]="'moderation.workspace.emptyFilteredTitle' | translate"
            [description]="'moderation.workspace.emptyFilteredBody' | translate"
          >
            <button type="button" class="btn btn-secondary btn-sm" (click)="clearFilters()">
              {{ 'moderation.workspace.clearFilters' | translate }}
            </button>
          </app-empty-state>

          <div class="ws-feed-scroll" *ngIf="feedItems.length > 0">
            <div class="ws-feed-list" role="list">
              <div *ngFor="let item of feedItems" role="listitem" [attr.id]="'moderation-' + item.key">
                <app-moderation-entry-card
                  [actionLabel]="actionLabel(item)"
                  [targetLabel]="targetLabel(item)"
                  [moderatorLabel]="moderatorLabel(item)"
                  [reason]="item.reason"
                  [createdAt]="item.createdAt"
                  [selected]="isSelected(item)"
                  [badgeTone]="item.badgeTone"
                  [iconTone]="item.iconTone"
                  (select)="selectFeedItem(item)"
                ></app-moderation-entry-card>
              </div>
            </div>
          </div>
        </section>

        <aside class="ws-detail-column" [attr.aria-label]="'moderation.workspace.detailAria' | translate">
          <div class="ws-placeholder-panel" *ngIf="!selectedFeedItem">
            <div class="ws-placeholder-panel-icon" aria-hidden="true">
              <app-ui-icon name="shield" size="lg"></app-ui-icon>
            </div>
            <h2 class="ws-placeholder-panel-title">{{ 'moderation.workspace.selectPromptTitle' | translate }}</h2>
            <p class="ws-placeholder-panel-body muted">{{ 'moderation.workspace.selectPromptBody' | translate }}</p>
          </div>

          <app-moderation-detail-panel
            *ngIf="selectedFeedItem"
            #moderationDetailPanel
            class="ws-detail-panel-host"
            [open]="true"
            [inline]="true"
            [actionLabel]="actionLabel(selectedFeedItem)"
            [badgeTone]="selectedFeedItem.badgeTone"
            [targetLabel]="targetLabel(selectedFeedItem)"
            [moderatorLabel]="moderatorLabel(selectedFeedItem)"
            [reason]="selectedFeedItem.reason"
            [evidence]="evidenceLabel(selectedFeedItem)"
            [durationLabel]="durationLabel()"
            [createdAt]="selectedFeedItem.createdAt"
            [entryId]="selectedFeedItem.key"
            [targetUserId]="selectedFeedItem.targetUserId || ''"
            [moderatorUserId]="selectedFeedItem.moderatorUserId"
            [channelId]="selectedFeedItem.channelDiscordId || ''"
            [messageCountLabel]="messageCountLabel(selectedFeedItem)"
            (closePanel)="closeDetail()"
          ></app-moderation-detail-panel>
        </aside>
      </div>
    </main>
  </div>
</div>
