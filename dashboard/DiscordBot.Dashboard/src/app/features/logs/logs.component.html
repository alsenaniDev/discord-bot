<div class="page-content page-workspace logs-page ws-page">
  <app-loading-state *ngIf="loading" [message]="'logs.loading' | translate"></app-loading-state>

  <app-error-state
    *ngIf="!loading && error"
    [title]="'logs.loadError' | translate"
    [description]="error"
    [retryLabel]="'common.tryAgain' | translate"
    (retry)="loadLogs()"
  ></app-error-state>

  <app-empty-state
    *ngIf="!loading && !error && !canAccessLogs"
    icon="🔒"
    [title]="'logs.workspace.permissionTitle' | translate"
    [description]="'logs.workspace.permissionBody' | translate"
  ></app-empty-state>

  <div class="logs-layout ws-layout" *ngIf="!loading && !error && canAccessLogs">
    <header class="logs-atf ws-atf">
      <app-page-workspace-hero
        class="logs-workspace-hero"
        [ariaLabel]="'workspaceHero.logs.ariaLabel' | translate"
        icon="logs"
        [title]="'titles.logs' | translate"
        [description]="'titles.logsSubtitle' | translate"
        [stats]="workspaceHeroStats"
        [footerMessage]="workspaceHeroFooter"
        [primaryAction]="workspaceHeroPrimaryAction"
        (primaryActionClick)="configureLogs()"
      ></app-page-workspace-hero>

      <app-page-notice>{{ 'logs.workspace.notice' | translate }}</app-page-notice>
    </header>

    <main class="logs-workspace ws-workspace">
      <app-logs-filter-bar
        class="logs-workspace-filters"
        [guildId]="guildId"
        [filters]="filters"
        [resultCount]="logs.length"
        (apply)="applyFilters()"
        (clear)="clearFilters()"
      ></app-logs-filter-bar>

      <div class="logs-master-detail ws-master-detail ws-master-detail--split">
        <section class="logs-list-column" [attr.aria-label]="'logs.workspace.listAria' | translate">
          <app-section-header
            [title]="'logs.activityLog' | translate"
            [lead]="'logs.workspace.listLead' | translate"
            [compact]="true"
          ></app-section-header>

          <app-empty-state
            *ngIf="logs.length === 0 && !hasActiveFilters"
            icon="📋"
            [title]="'logs.workspace.emptyTitle' | translate"
            [description]="'logs.workspace.emptyBody' | translate"
          ></app-empty-state>

          <app-empty-state
            *ngIf="logs.length === 0 && hasActiveFilters"
            icon="🔍"
            [title]="'logs.workspace.emptyFilteredTitle' | translate"
            [description]="'logs.workspace.emptyFilteredBody' | translate"
          >
            <button type="button" class="btn btn-secondary btn-sm" (click)="clearFilters()">
              {{ 'logs.workspace.clearFilters' | translate }}
            </button>
          </app-empty-state>

          <div class="logs-list-scroll" *ngIf="logs.length > 0">
            <div class="logs-list" role="list">
              <div *ngFor="let log of logs" role="listitem" [attr.id]="'log-' + log.id">
                <app-logs-entry-card
                  [log]="log"
                  [selected]="isSelected(log)"
                  [severity]="severityTone(log.type)"
                  [severityLabel]="severityLabel(log.type)"
                  [iconName]="eventIcon(log.type)"
                  [actorLabel]="actorLabel(log)"
                  [targetLabel]="targetLabel(log)"
                  (select)="selectLog(log)"
                ></app-logs-entry-card>
              </div>
            </div>
          </div>
        </section>

        <aside class="logs-detail-column" [attr.aria-label]="'logs.workspace.detailAria' | translate">
          <div class="logs-detail-placeholder ws-placeholder-panel" *ngIf="!selectedLog">
            <div class="logs-detail-placeholder-icon ws-placeholder-panel-icon" aria-hidden="true">
              <app-ui-icon name="logs" size="lg"></app-ui-icon>
            </div>
            <h2 class="ws-placeholder-panel-title">{{ 'logs.workspace.selectPromptTitle' | translate }}</h2>
            <p class="ws-placeholder-panel-body muted">{{ 'logs.workspace.selectPromptBody' | translate }}</p>
          </div>

          <app-logs-detail-panel
            *ngIf="selectedLog"
            #logDetailPanel
            [log]="selectedLog"
            [open]="true"
            [inline]="true"
            [severity]="severityTone(selectedLog.type)"
            [severityLabel]="severityLabel(selectedLog.type)"
            [actorLabel]="actorLabel(selectedLog)"
            [targetLabel]="targetLabel(selectedLog)"
            [channelLabel]="channelLabel(selectedLog)"
            [metadataPreview]="metadataPreview(selectedLog)"
            [canClear]="canClearLogs"
            (closePanel)="closeDetail()"
            (clearAll)="openClearDialog()"
          ></app-logs-detail-panel>
        </aside>
      </div>
    </main>
  </div>

  <div class="confirm-overlay" *ngIf="showClearDialog" (click)="closeClearDialog()">
    <div class="confirm-dialog card" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
      <h3>{{ 'logs.clearTitle' | translate }}</h3>
      <p class="muted">{{ 'logs.clearWarning' | translate }}</p>
      <label>
        {{ 'logs.clearConfirmLabel' | translate }}
        <input
          type="text"
          [(ngModel)]="clearConfirmation"
          [placeholder]="'logs.clearConfirmPlaceholder' | translate"
          autocomplete="off"
          spellcheck="false"
        />
      </label>
      <div class="confirm-actions">
        <button type="button" class="btn btn-secondary btn-sm" [disabled]="clearing" (click)="closeClearDialog()">
          {{ 'common.cancel' | translate }}
        </button>
        <button
          type="button"
          class="btn btn-danger btn-sm"
          [disabled]="!canConfirmClear || clearing"
          (click)="clearAllLogs()"
        >
          <span class="spinner inline" *ngIf="clearing"></span>
          {{ 'logs.clearConfirmButton' | translate }}
        </button>
      </div>
    </div>
  </div>
</div>
