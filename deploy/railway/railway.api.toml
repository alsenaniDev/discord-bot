# Example Railway service config for the API.
# In Railway dashboard: Settings → Config-as-code → path: deploy/railway/railway.api.toml
# Or paste equivalent settings in the UI.

[build]
builder = "DOCKERFILE"
dockerfilePath = "deploy/railway/Dockerfile.api"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
