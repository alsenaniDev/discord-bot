# Railway service config for the private Lavalink service.
# Config-as-code path in Railway: deploy/railway/railway.lavalink.toml
# Do not generate a public domain or TCP proxy for this service.

[build]
builder = "DOCKERFILE"
dockerfilePath = "deploy/railway/Dockerfile.lavalink"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
