services:
  postgres:
    image: postgres:16-alpine
    container_name: discordbot-postgres
    environment:
      POSTGRES_DB: discordbot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d discordbot"]
      interval: 5s
      timeout: 5s
      retries: 5

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4.2.1
    container_name: discordbot-lavalink
    environment:
      LAVALINK_SERVER_PASSWORD: ${LAVALINK_PASSWORD:-youshallnotpass}
      _JAVA_OPTIONS: "-Xms256M -Xmx512M"
    ports:
      - "2333:2333"
    volumes:
      - ./deploy/lavalink/application.yml:/opt/Lavalink/application.yml:ro
    restart: unless-stopped

volumes:
  postgres_data:
